name: Pruebas

on:
  push:
  pull_request:

jobs:
  verificar:
    name: Pruebas y evaluación del intérprete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Linter
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      # El set de evaluación dice qué DEBERÍA entenderse de cada frase, no lo
      # que el código hace hoy. Con el piso en 90, un caso que empeora se ve
      # aquí y no en la siguiente demostración.
      - name: Evaluación del intérprete
        run: npm run medir-interprete
        env:
          MINIMO_ACIERTO: "90"
