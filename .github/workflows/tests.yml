name: Pruebas

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unitarias (capa de IA y parseo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  db:
    name: RLS contra Supabase local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      # Levanta Postgres, Auth y la API en Docker y aplica migraciones y seed.
      - run: supabase start
      - run: npm run test:db
      - if: always()
        run: supabase stop --no-backup
